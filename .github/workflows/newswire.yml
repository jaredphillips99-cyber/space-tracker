name: Daily Newswire

on:
  schedule:
    # 8:30 AM ET (pre-market) = 12:30 UTC (EDT); off by 1hr during EST winter, same caveat as before
    - cron: '30 12 * * 1-5'
    # 5:00 PM ET (post-market) = 21:00 UTC (EDT); same DST caveat
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # allows manual trigger from GitHub Actions tab

jobs:
  newswire:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm ci

      - name: Run newswire script
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/newswire.mjs

      # AI Index daily close — post-market leg only (5pm ET / 21:00 UTC), plus
      # manual dispatch. The index is a single daily close value, so it must NOT
      # also run on the 8:30am ET pre-market leg. Zero Claude cost — no
      # ANTHROPIC_API_KEY needed.
      - name: Run index calc (post-market close only)
        if: ${{ github.event.schedule == '0 21 * * 1-5' || github.event_name == 'workflow_dispatch' }}
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: node scripts/indexCalc.mjs